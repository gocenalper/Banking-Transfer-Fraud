server:
  port: 8082

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledger_db # database-per-service: no other service may touch it
    username: bank
    password: bank
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema; Hibernate only verifies it matches
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
